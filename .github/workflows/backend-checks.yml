name: Backend checks
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-checks.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: backend
