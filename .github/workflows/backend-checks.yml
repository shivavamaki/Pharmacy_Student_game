name: Backend checks
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'migration/**', 'package.json', 'package-lock.json', '.github/workflows/backend-checks.yml']
  push:
    branches: [main, migration/cloudflare-foundation]
    paths: ['backend/**', 'frontend/**', 'migration/**', 'package.json', 'package-lock.json', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: for file in frontend/*.mjs; do node --check "$file"; done
      - run: npm test
        working-directory: backend
